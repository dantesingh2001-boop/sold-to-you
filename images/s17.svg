<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520"><rect width="800" height="520" fill="#fdfcf8"/><rect x="40" y="40" width="345" height="380" fill="#fdfcf8" stroke="#111" stroke-width="5"/><rect x="415" y="40" width="345" height="380" fill="#111"/><text x="212" y="180" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="900" fill="#1ba45c" letter-spacing="3" text-anchor="middle">PRAISED</text><text x="212" y="235" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" fill="#111" letter-spacing="0" text-anchor="middle">THE FILM WAS CALLED</text><text x="212" y="262" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" fill="#111" letter-spacing="0" text-anchor="middle">BRAVE AND LOVELY</text><text x="588" y="180" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="900" fill="#e8213b" letter-spacing="3" text-anchor="middle">PULLED</text><text x="588" y="235" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" fill="#fdfcf8" letter-spacing="0" text-anchor="middle">THE SAME FILM WAS CALLED</text><text x="588" y="262" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" fill="#fdfcf8" letter-spacing="0" text-anchor="middle">AN INSULT</text><path d="M400 30 l10 40 -16 30 18 40 -14 34 20 44 -18 36 16 40 -10 40" stroke="#111" stroke-width="6" fill="none"/><text x="400" y="480" font-family="Courier New,monospace" font-size="20" font-weight="400" fill="#8a8478" letter-spacing="0" text-anchor="middle">ONE 30-SECOND FILM. TWO VERDICTS. BOTH REAL.</text></svg>